<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/styles.css">
    <script src="./js/project2.js"></script>
    <title>CMST 388 Form Validation</title>
</head>
<body>
    <div  id="error"></div>

    <form id="form" action="/" method="post">
        <div class="first-name">
            <label for="fname">First Name:<span class="required">*</span></label>
            <input type="text" id="fname" name="firstname" placeholder="First name" required>
        </div>
        
        <div class="last-name">
            <label for="lname">Last Name:<span class="required">*</span></label>
            <input type="text" id="lname" name="lastname" placeholder="Last name" required>
        </div>
<!-- Remove placholder text once user selects field. Must be alpha only. -->

        <div class="address">
            <label for="address">Address:<span class="required">*</span></label>
            <input type="text" id="address" name="address" placeholder="Address" required>
        </div>

        <div class="city">
            <label for="city">City:<span class="required">*</span></label>
            <input type="text" id="city" name="city" placeholder="City" required>
        </div>

        <div class="state">
            <label for="state">State:<span class="required">*</span></label>
            <select name="state" id="state" required>
                <option value="" id="disabled-state" disabled selected>Select a state</option>
                <option value="AL">Alabama</option>
                <option value="AK">Alaska</option>
                <option value="AZ">Arizona</option>
                <option value="AR">Arkansas</option>
                <option value="CA">California</option>
                <option value="CO">Colorado</option>
                <option value="CT">Connecticut</option>
                <option value="DE">Delaware</option>
                <option value="DC">District of Columbia</option>
                <option value="FL">Florida</option>
                <option value="GA">Georgia</option>
                <option value="HI">Hawaii</option>
                <option value="ID">Idaho</option>
                <option value="IL">Illinois</option>
                <option value="IN">Indiana</option>
                <option value="IA">Iowa</option>
                <option value="KS">Kansas</option>
                <option value="KY">Kentucky</option>
                <option value="LA">Louisiana</option>
                <option value="ME">Maine</option>
                <option value="MD">Maryland</option>
                <option value="MA">Massachusetts</option>
                <option value="MI">Michigan</option>
                <option value="MN">Minnesota</option>
                <option value="MS">Mississippi</option>
                <option value="MO">Missouri</option>
                <option value="MT">Montana</option>
                <option value="NE">Nebraska</option>
                <option value="NV">Nevada</option>
                <option value="NH">New Hampshire</option>
                <option value="NJ">New Jersey</option>
                <option value="NM">New Mexico</option>
                <option value="NY">New York</option>
                <option value="NC">North Carolina</option>
                <option value="ND">North Dakota</option>
                <option value="OH">Ohio</option>
                <option value="OK">Oklahoma</option>
                <option value="OR">Oregon</option>
                <option value="PA">Pennsylvania</option>
                <option value="RI">Rhode Island</option>
                <option value="SC">South Carolina</option>
                <option value="SD">South Dakota</option>
                <option value="TN">Tennessee</option>
                <option value="TX">Texas</option>
                <option value="UT">Utah</option>
                <option value="VT">Vermont</option>
                <option value="VA">Virginia</option>
                <option value="WA">Washington</option>
                <option value="WV">West Virginia</option>
                <option value="WI">Wisconsin</option>
                <option value="WY">Wyoming</option>
            </select>
        </div>
        <!-- drop down menu -->

        <div class="zip-code">
            <label for="zipcode">Zip Code:<span class="required">*</span></label>
            <input type="text" id="zipcode" name="zipcode" inputmode="numeric" placeholder="12345" pattern="\d{5}" maxlength="5" required>
        </div>

        <div class="phone">
            <label for="phone">Phone:<span class="required">*</span></label>
            <input type="tel" id="telarea" name="areacode" placeholder="123" pattern="[0-9]{3}" minlength="3" maxlength="3" required>
            <input type="tel" id="telnum" name="phone" placeholder="456-7890" pattern="[0-9]{3}-[0-9]{4}" minlength="7" maxlength="7" size="5" required>
        </div>

        <div class="email">
            <label for="email">Email:<span class="required">*</span></label>
            <input type="text" id="email" name="email" placeholder="name@domain.extension" required>
        </div>
        <!-- Length of "name" can be up to 64 characters in length, and "domain" may be up to 252 characters in length. "Invalid e-mail address" error message. -->

        <div class="email--confirm">
            <label for="email">Confirm Email:<span class="required">*</span></label>
            <input type="text" id="cemail" name="email" placeholder="name@domain.extension" required>
        </div>
        <!-- Confirm E-mail Address	The user must enter in the exact same e-mail address entered in the previous E-mail Address field. If not, an error message will be generated. -->

        <div class="comment">
            <label for="message">Comments:
            <textarea name="message" id="message" rows="5"></textarea>
        </div>
        
        <div class="btns">
            <input type="submit" value="Submit">
            <input type="reset" value="Reset">
        </div>
    </form>

</body>
</html>
